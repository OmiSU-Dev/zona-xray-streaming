name: ZONA streaming build

on:
  workflow_dispatch:
  push:
    branches: [zona/streaming-poc]

permissions:
  contents: write

jobs:
  build-dx11-avx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 8GB

      - uses: snickerbockers/submodules-init@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build DX11-AVX x64
        run: msbuild src/engine-vs2022.sln /p:Configuration=DX11-AVX /p:Platform=x64 /m /v:minimal

      - name: Collect exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./_build -Recurse -Filter "AnomalyDX11AVX.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -Recurse -Filter "AnomalyDX11AVX.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw "AnomalyDX11AVX.exe not found after build" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName artifact/AnomalyDX11AVX.exe
          (Get-FileHash artifact/AnomalyDX11AVX.exe -Algorithm SHA256).Hash | Out-File artifact/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zona-streaming-AnomalyDX11AVX
          path: artifact/AnomalyDX11AVX.exe
          retention-days: 14
